[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "event-harvester"
version = "0.1.0"
description = "Harvest Discord + Telegram messages, extract tasks via OpenRouter, create in TickTick"
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.42",
    "litellm[proxy]>=1.82.4,<2",
    "numpy>=1.24",
    "python-dotenv>=1.0",
    "ticktick-py>=2.0",
    "ccl-chromium-reader @ git+https://github.com/cclgroupltd/ccl_chromium_reader.git", "google-api-python-client>=2.193.0,<3", "google-auth-httplib2>=0.3.0,<0.4", "google-auth-oauthlib>=1.3.0,<2", "python-dateutil>=2.9.0.post0,<3",
    "scikit-learn>=1.3",
    "joblib>=1.3", "sentence-transformers>=3.0", "pywin32>=306", "signal-export>=2.0", "rookiepy>=0.5", "playwright>=1.40", "cryptg>=0.5.2,<0.6",
    "flet>=0.25", "flet-web>=0.25",
    "mcp[cli]>=1,<2", "pillow>=12.2.0,<13", "opentelemetry-api>=1.41.1,<2", "opentelemetry-sdk>=1.41.1,<2", "opentelemetry-exporter-otlp-proto-grpc>=1.41.1,<2", "fastmcp>=3.4.2,<4",
    "icalendar>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
]

[project.scripts]
event-harvester = "event_harvester.cli:main_sync"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.13"
playwright-stealth = ">=2.0.2,<3"

# PyTorch CUDA wheels.  torch arrives transitively via sentence-transformers,
# and the default PyPI wheel on Windows is CPU-only -- so the GTX 1070 in this
# box sat idle while the reranker ran on the CPU.
#
# cu126 specifically: it is the newest CUDA line whose wheels still compile for
# sm_61 (Pascal).  Verified on the card rather than assumed --
# torch.cuda.get_arch_list() reports
#   ['sm_50','sm_60','sm_61','sm_70','sm_75','sm_80','sm_86','sm_90']
# and the 1070 reports sm_61.  Newer CUDA lines drop Pascal; do not bump this
# to cu128+ without re-checking the arch list on this card first.
#
# Driver is 560.94, which supports CUDA 12.6.
#
# Measured on the reranker's real workload (150 query/message pairs, the
# harvester's total cap): CPU 1404 ms -> CUDA 102 ms, a 13.7x speedup, using
# 128 MB of the 8 GB card. sentence-transformers picks CUDA up automatically,
# so no application code changes.
[tool.pixi.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu126"]

[tool.pixi.pypi-dependencies]
event-harvester = { path = ".", editable = true }
universal_controller = { path = "ext/universal_controller", editable = true }
torch = { version = ">=2.13", index = "https://download.pytorch.org/whl/cu126" }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
# event-harvester as a persistent MCP service (the gateway's backend)
eh-service = "event-harvester mcp --transport streamable-http --port 8765"
# central FastMCP gateway fronting the backend(s) on http://127.0.0.1:9000/mcp
gateway = "python gateway.py"

[tool.pixi.feature.dev.tasks]
test = "pytest -v"
lint = "ruff check src/ tests/"
format = "ruff format src/ tests/"
